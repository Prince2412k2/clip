<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>clippy</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0c0a;
    --bg-2: #121310;
    --fg: #eef0e6;
    --dim: #8a8f80;
    --line: #2a2c26;
    --accent: #ffb238;
    --accent-dim: #6b501c;
    --danger: #ff6a5b;
    --ok: #6fd68a;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f0e6;
      --bg-2: #e8e4d4;
      --fg: #1c1c16;
      --dim: #6b6a5c;
      --line: #d3cfba;
      --accent: #b9750a;
      --accent-dim: #e3c184;
      --danger: #c73b2a;
      --ok: #2f8a4f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    max-width: 100%;
    overflow-x: hidden;
    height: 100%;
  }
  body {
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    gap: 16px;
  }

  /* fine scanline grain for texture, kept very subtle */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      to bottom,
      color-mix(in srgb, var(--fg) 3%, transparent) 0px,
      transparent 1px 3px
    );
    opacity: 0.5;
    z-index: 0;
  }

  header, .targets, .dropzone, .paste-bar, #status {
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    animation: rise 0.5s ease both;
  }
  .brand {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: baseline;
    gap: 0.5em;
  }
  .brand .clip { font-size: 1.2em; transform: rotate(-8deg); display: inline-block; }
  .brand small {
    font-size: 0.62rem;
    color: var(--dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
  }
  #refresh {
    appearance: none;
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    font-size: 1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.4s ease, color 0.15s, border-color 0.15s;
  }
  #refresh:active { color: var(--accent); border-color: var(--accent-dim); }
  #refresh.spin { transform: rotate(360deg); }

  .targets {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    scrollbar-width: none;
    animation: rise 0.5s ease 0.05s both;
  }
  .targets::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--dim);
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .chip .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
    opacity: 0.6;
  }
  .chip.online .dot { background: var(--ok); opacity: 1; }
  .chip.selected {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .chip.selected .dot { background: var(--bg); opacity: 0.7; }
  .chip.empty {
    cursor: default;
    color: var(--dim);
    font-style: italic;
  }

  .dropzone {
    flex: 1;
    min-height: 0;
    border: 2px dashed var(--line);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s, transform 0.15s;
    animation: rise 0.55s ease 0.1s both;
  }
  .dropzone .glyph {
    font-size: 2.6rem;
    transform: rotate(-10deg);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .dropzone .lead {
    font-size: 1rem;
    font-weight: 700;
    color: var(--fg);
  }
  .dropzone .sub {
    font-size: 0.78rem;
    color: var(--dim);
  }
  .dropzone.drag {
    border-color: var(--accent);
    border-style: solid;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    transform: scale(0.99);
  }
  .dropzone.drag .glyph { transform: rotate(6deg) scale(1.15); }
  .dropzone.busy { opacity: 0.6; pointer-events: none; }
  .dropzone.busy .glyph { animation: spin-slow 1s linear infinite; }
  .dropzone input[type="file"] { display: none; }

  .paste-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px 4px 4px 16px;
    animation: rise 0.55s ease 0.15s both;
  }
  .paste-bar .glyph {
    color: var(--dim);
    font-size: 1rem;
  }
  #pasteInput {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 14px 0;
    outline: none;
  }
  #pasteInput::placeholder { color: var(--dim); }
  #sendBtn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
  }
  #sendBtn:active { transform: scale(0.96); }
  #sendBtn:disabled { opacity: 0.35; cursor: default; }

  #status {
    font-size: 0.82rem;
    padding: 0 2px;
    min-height: 1.2em;
    color: var(--dim);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
  }
  #status.show { opacity: 1; transform: translateY(0); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="clip">📎</span> clippy <small>tailnet clipboard</small></div>
  <button id="refresh" title="Refresh peers" type="button">⟳</button>
</header>

<div id="targets" class="targets"></div>

<label id="dropzone" class="dropzone">
  <input id="fileInput" type="file" accept="*/*">
  <div class="glyph">📎</div>
  <div class="lead">Drop a file</div>
  <div class="sub">or tap to browse · max 20&nbsp;MB</div>
</label>

<div class="paste-bar">
  <span class="glyph">❯</span>
  <input id="pasteInput" type="text" placeholder="Paste or type, then Enter…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="sendBtn" type="button" disabled>Send</button>
</div>

<div id="status"></div>

<script>
(function () {
  "use strict";

  var MAX_BYTES = 20 * 1024 * 1024; // 20 MiB

  var targetsEl = document.getElementById("targets");
  var refreshBtn = document.getElementById("refresh");
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var pasteInput = document.getElementById("pasteInput");
  var sendBtn = document.getElementById("sendBtn");
  var statusEl = document.getElementById("status");

  var selectedTarget = localStorage.getItem("clippy.target") || "";

  // ---- status line ----
  var statusTimer = null;
  function showStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "show " + (kind === "ok" ? "ok" : "err");
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      statusEl.className = "";
    }, 4000);
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  // ---- targets (peer chips) ----
  function selectTarget(name) {
    selectedTarget = name;
    localStorage.setItem("clippy.target", name);
    Array.prototype.forEach.call(targetsEl.children, function (chip) {
      chip.classList.toggle("selected", chip.dataset.name === name);
    });
  }

  function loadPeers() {
    refreshBtn.classList.add("spin");
    fetch("/v1/peers").then(function (res) {
      if (!res.ok) throw new Error("Server error (" + res.status + ")");
      return res.json();
    }).then(function (peers) {
      targetsEl.innerHTML = "";
      if (!peers || peers.length === 0) {
        var empty = document.createElement("div");
        empty.className = "chip empty";
        empty.textContent = "No machines found";
        targetsEl.appendChild(empty);
        return;
      }
      var haveSelected = false;
      peers.forEach(function (p) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (p.online ? " online" : "");
        chip.dataset.name = p.name;
        chip.innerHTML = '<span class="dot"></span>' + p.name;
        chip.addEventListener("click", function () { selectTarget(p.name); });
        targetsEl.appendChild(chip);
        if (p.name === selectedTarget) haveSelected = true;
      });
      if (!haveSelected) selectedTarget = "";
      selectTarget(selectedTarget || peers[0].name);
    }).catch(function (err) {
      showStatus("Could not load peers: " + err.message, "err");
    }).finally(function () {
      refreshBtn.classList.remove("spin");
    });
  }

  refreshBtn.addEventListener("click", loadPeers);

  // ---- sending ----
  function doSend(formData, label, onDone) {
    if (!selectedTarget) {
      showStatus("Choose a machine first.", "err");
      if (onDone) onDone();
      return;
    }
    formData.append("target", selectedTarget);
    fetch("/v1/send", { method: "POST", body: formData }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error(t || ("Server error (" + res.status + ")"));
        });
      }
      showStatus("Sent " + label + " → " + selectedTarget, "ok");
    }).catch(function (err) {
      showStatus("Failed to send: " + err.message, "err");
    }).finally(function () {
      if (onDone) onDone();
    });
  }

  // ---- paste / type text: send on Enter, or immediately on paste ----
  function sendPasteInput() {
    var text = pasteInput.value;
    if (!text.trim()) return;
    var fd = new FormData();
    fd.append("text", text);
    sendBtn.disabled = true;
    doSend(fd, "text", function () {
      pasteInput.value = "";
      sendBtn.disabled = true;
    });
  }

  pasteInput.addEventListener("input", function () {
    sendBtn.disabled = !pasteInput.value.trim();
  });
  pasteInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      sendPasteInput();
    }
  });
  pasteInput.addEventListener("paste", function () {
    // let the paste land, then send it straight away
    setTimeout(sendPasteInput, 0);
  });
  sendBtn.addEventListener("click", sendPasteInput);

  // ---- drop / pick a file: sends immediately, no confirmation step ----
  function sendFile(file) {
    if (!file) return;
    if (file.size > MAX_BYTES) {
      showStatus("File too large (" + fmtSize(file.size) + "). Max is 20 MB.", "err");
      return;
    }
    var fd = new FormData();
    fd.append("file", file, file.name);
    dropzone.classList.add("busy");
    doSend(fd, file.name || "file", function () {
      dropzone.classList.remove("busy");
      fileInput.value = "";
    });
  }

  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) sendFile(fileInput.files[0]);
  });

  ["dragenter", "dragover"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.add("drag");
    });
  });
  ["dragleave", "dragend"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove("drag");
    });
  });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("drag");
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0]) sendFile(files[0]);
  });

  // ---- init ----
  loadPeers();
})();
</script>

</body>
</html>
